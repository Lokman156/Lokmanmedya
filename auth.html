<html lang="tr">
<head>

  <title>Lokman Medya — Giriş Yap / Kayıt Ol</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
  apiKey: "AIzaSyAIBQroiVZKWYtuqtzSXz1mLSu0j_CJ4xs",  // ← GÜNCEL API KEY
  authDomain: "medyakayit-137d8.firebaseapp.com",
  projectId: "medyakayit-137d8",
  storageBucket: "medyakayit-137d8.firebasestorage.app",
  messagingSenderId: "534183963302",
  appId: "1:534183963302:web:8ac0a3e7af02b5c130e267",
  measurementId: "G-6QGSG509X6"
};
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --secondary: #ec4899;
      --dark: #0f0f1a;
      --darker: #0a0a12;
      --card: #16162a;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Inter', sans-serif; 
      background: var(--dark); 
      color: var(--text); 
      min-height: 100vh;
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    
    /* Background Glow */
    body::before {
      content: ''; position: absolute; width: 600px; height: 600px;
      background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
      top: -200px; right: -200px; opacity: 0.3;
    }
    body::after {
      content: ''; position: absolute; width: 400px; height: 400px;
      background: radial-gradient(circle, var(--secondary) 0%, transparent 70%);
      bottom: -100px; left: -100px; opacity: 0.2;
    }
    
    .auth-container {
      background: var(--card);
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.05);
      padding: 40px;
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      backdrop-filter: blur(20px);
    }
    
    .auth-header { text-align: center; margin-bottom: 30px; }
    .auth-logo { 
      font-size: 2rem; font-weight: 800; 
      background: linear-gradient(135deg, var(--primary), var(--secondary)); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    .auth-header h2 { font-size: 1.5rem; font-weight: 700; }
    .auth-header p { color: var(--text-muted); font-size: 0.9rem; margin-top: 5px; }
    
    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block; font-size: 0.8rem; font-weight: 600;
      color: var(--text-muted); margin-bottom: 8px; 
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .form-input {
      width: 100%; padding: 14px 16px;
      background: var(--darker); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; font-size: 1rem; color: var(--text);
      transition: 0.2s; font-family: 'Inter', sans-serif;
    }
    .form-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
    .form-input::placeholder { color: #64748b; }
    
    .btn-submit {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff; border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      transition: 0.3s; font-family: 'Inter', sans-serif;
      margin-top: 10px;
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4); }
    
    .auth-error {
      background: rgba(239,68,68,0.1); color: var(--danger);
      padding: 12px; border-radius: 10px; font-size: 0.9rem;
      margin-bottom: 20px; display: none; align-items: center; gap: 10px;
    }
    
    .auth-switch { text-align: center; margin-top: 20px; color: var(--text-muted); font-size: 0.9rem; }
    .auth-switch a { color: var(--primary); text-decoration: none; font-weight: 600; cursor: pointer; }
    .auth-switch a:hover { text-decoration: underline; }
    
    .back-home { 
      display: block; text-align: center; margin-top: 25px; 
      color: var(--text-muted); text-decoration: none; font-size: 0.9rem;
    }
    .back-home:hover { color: var(--primary); }
    
    /* Loader */
    .btn-submit.loading { opacity: 0.7; pointer-events: none; }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-header">
      <div class="auth-logo">🔥 Lokman Medya</div>
      <h2 id="formTitle">Giriş Yap</h2>
      <p id="formSubtitle">Hesabınıza erişin</p>
    </div>

    <div class="auth-error" id="authError">
      <i class="fas fa-exclamation-circle"></i>
      <span id="errorMessage"></span>
    </div>

    <form id="authForm">
      <!-- Kayıt modunda gösterilecek isim alanı -->
      <div class="form-group" id="nameField" style="display: none;">
        <label class="form-label">Ad Soyad</label>
        <input type="text" class="form-input" id="userName" placeholder="Adınızı girin">
      </div>
      
      <div class="form-group">
        <label class="form-label">E-posta Adresi</label>
        <input type="email" class="form-input" id="userEmail" placeholder="ornek@mail.com" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">Şifre</label>
        <input type="password" class="form-input" id="userPassword" placeholder="••••••••" required minlength="6">
      </div>
      
      <button type="submit" class="btn-submit" id="submitButton">
        <i class="fas fa-sign-in-alt"></i> Giriş Yap
      </button>
    </form>

    <div class="auth-switch">
      <span id="switchText">Hesabınız yok mu?</span>
      <a id="switchLink" onclick="toggleMode()">Kayıt Ol</a>
    </div>

    <a href="index.html" class="back-home">
      <i class="fas fa-arrow-left"></i> Ana Sayfaya Dön
    </a>
  </div>

  <script>
    let currentMode = 'login'; // login veya register
    
    // URL'den modu al
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('mode') === 'register') {
      currentMode = 'register';
    }
    
    // Sayfa yüklendiğinde modu ayarla
    updateFormMode();
    
    // Form gönderimi
    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('userEmail').value.trim();
      const password = document.getElementById('userPassword').value;
      const name = document.getElementById('userName').value.trim();
      
      hideError();
      
      if (!email || !password) {
        showError('Lütfen tüm alanları doldurun.');
        return;
      }
      
      if (currentMode === 'register' && !name) {
        showError('Lütfen adınızı girin.');
        return;
      }
      
      const submitBtn = document.getElementById('submitButton');
      submitBtn.classList.add('loading');
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Lütfen bekleyin...';
      
      try {
        if (currentMode === 'register') {
          // Kayıt Ol
          const userCredential = await auth.createUserWithEmailAndPassword(email, password);
          await userCredential.user.updateProfile({ displayName: name });
          
          // Firestore'a kullanıcı kaydet
          await db.collection('users').doc(userCredential.user.uid).set({
            email: email,
            displayName: name,
            balance: 0.00,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          
          console.log('Kayıt başarılı:', userCredential.user.email);
          window.location.href = 'dashboard.html';
        } else {
          // Giriş Yap
          const userCredential = await auth.signInWithEmailAndPassword(email, password);
          console.log('Giriş başarılı:', userCredential.user.email);
          window.location.href = 'dashboard.html';
        }
      } catch (error) {
        console.error('Auth hatası:', error.code, error.message);
        
        let errorMsg = 'Bir hata oluştu. Lütfen tekrar deneyin.';
        switch (error.code) {
          case 'auth/email-already-in-use':
            errorMsg = 'Bu e-posta adresi zaten kullanılıyor.';
            break;
          case 'auth/invalid-email':
            errorMsg = 'Geçersiz e-posta adresi.';
            break;
          case 'auth/weak-password':
            errorMsg = 'Şifre en az 6 karakter olmalıdır.';
            break;
          case 'auth/user-not-found':
          case 'auth/invalid-credential':
            errorMsg = 'E-posta veya şifre hatalı.';
            break;
          case 'auth/too-many-requests':
            errorMsg = 'Çok fazla başarısız deneme. Lütfen daha sonra tekrar deneyin.';
            break;
          default:
            errorMsg = error.message;
        }
        showError(errorMsg);
      } finally {
        submitBtn.classList.remove('loading');
        if (currentMode === 'register') {
          submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Kayıt Ol';
        } else {
          submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Giriş Yap';
        }
      }
    });
    
    function toggleMode() {
      currentMode = currentMode === 'login' ? 'register' : 'login';
      updateFormMode();
      hideError();
      document.getElementById('authForm').reset();
    }
    
    function updateFormMode() {
      const nameField = document.getElementById('nameField');
      const formTitle = document.getElementById('formTitle');
      const formSubtitle = document.getElementById('formSubtitle');
      const submitButton = document.getElementById('submitButton');
      const switchText = document.getElementById('switchText');
      const switchLink = document.getElementById('switchLink');
      
      if (currentMode === 'register') {
        nameField.style.display = 'block';
        formTitle.textContent = 'Kayıt Ol';
        formSubtitle.textContent = 'Yeni bir hesap oluşturun';
        submitButton.innerHTML = '<i class="fas fa-user-plus"></i> Kayıt Ol';
        switchText.textContent = 'Zaten hesabınız var mı?';
        switchLink.textContent = 'Giriş Yap';
      } else {
        nameField.style.display = 'none';
        formTitle.textContent = 'Giriş Yap';
        formSubtitle.textContent = 'Hesabınıza erişin';
        submitButton.innerHTML = '<i class="fas fa-sign-in-alt"></i> Giriş Yap';
        switchText.textContent = 'Hesabınız yok mu?';
        switchLink.textContent = 'Kayıt Ol';
      }
    }
    
    function showError(message) {
      const errorEl = document.getElementById('authError');
      document.getElementById('errorMessage').textContent = message;
      errorEl.style.display = 'flex';
    }
    
    function hideError() {
      document.getElementById('authError').style.display = 'none';
    }
  </script>
</body>
</html>
